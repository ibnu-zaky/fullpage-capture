<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Hasil Full Page Capture</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #17171f;
    color: #f0f0f5;
    min-height: 100vh;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 20px;
    background: #1e1e2e;
    border-bottom: 1px solid #2e2e40;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 15px;
    margin: 0;
    white-space: nowrap;
  }
  .actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  button {
    padding: 9px 16px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  #copyBtn { background: #7c5cff; color: white; }
  #copyBtn:hover { background: #6a4ce0; }
  #downloadBtn { background: #2e2e40; color: #f0f0f5; }
  #downloadBtn:hover { background: #3a3a52; }
  #statusMsg {
    font-size: 12px;
    color: #9ada9a;
    align-self: center;
  }
  #statusMsg.error { color: #ff8f8f; }
  main {
    display: flex;
    justify-content: center;
    padding: 24px;
  }
  #resultImg {
    max-width: 100%;
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    border-radius: 4px;
  }
  #loading {
    padding: 60px 20px;
    text-align: center;
    color: #888;
  }
</style>
</head>
<body>
  <header>
    <h1>📸 Hasil Full Page Capture</h1>
    <div class="actions">
      <span id="statusMsg"></span>
      <button id="copyBtn">Copy to Clipboard</button>
      <button id="downloadBtn">Download PNG</button>
    </div>
  </header>
  <main>
    <div id="loading">Memuat gambar...</div>
    <img id="resultImg" style="display:none;" alt="Full page capture result">
  </main>
  <script src="result.js"></script>
</body>
</html>
